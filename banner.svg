<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 375"
     width="100%"
     height="100%">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070b"/>
      <stop offset="45%" stop-color="#07111a"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>

    <!-- Blue -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Purple -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#ffffff"
            stroke-width="0.5"
            stroke-opacity="0.035"/>
    </pattern>

    <!-- Ambient blue glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#1686d9" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#1686d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Globe -->
    <radialGradient id="globe"
                    cx="45%"
                    cy="45%"
                    r="65%">
      <stop offset="0%" stop-color="#172b3d"/>
      <stop offset="55%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#02070d"/>
    </radialGradient>

    <!-- Cards -->
    <linearGradient id="card"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#0c1823"/>
      <stop offset="100%" stop-color="#050b11"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="4"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Globe clipping -->
    <clipPath id="globeClip">
      <circle cx="145"
              cy="190"
              r="155"/>
    </clipPath>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect width="1200"
        height="375"
        fill="url(#bg)"/>

  <rect width="1200"
        height="375"
        fill="url(#grid)"/>

  <ellipse cx="180"
           cy="180"
           rx="300"
           ry="270"
           fill="url(#blueGlow)"/>


  <!-- ====================================================== -->
