      <circle cx="119" cy="125" r="1.1"/>
      <circle cx="132" cy="137" r="1.5"/>
      <circle cx="143" cy="151" r="1.2"/>
      <circle cx="157" cy="165" r="1.5"/>
      <circle cx="170" cy="177" r="1.2"/>
      <circle cx="180" cy="191" r="1.5"/>
      <circle cx="191" cy="205" r="1"/>
      <circle cx="118" cy="151" r="1"/>
      <circle cx="92" cy="135" r="1"/>
