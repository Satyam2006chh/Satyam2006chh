<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 375"
     width="100%"
     height="100%">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="50%" stop-color="#0a1019"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Main blue gradient -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Purple accent -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">

      <path d="M32 0H0V32"
            fill="none"
            stroke="#ffffff"
            stroke-width="0.5"
            stroke-opacity="0.035"/>
    </pattern>

    <!-- Glow -->
    <filter id="glowBlue"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
          stdDeviation="4"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
          stdDeviation="2"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft radial light -->
    <radialGradient id="ambientBlue">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200"
        height="375"
        fill="url(#bg)"/>

  <rect width="1200"
        height="375"
        fill="url(#grid)"/>


  <!-- Ambient lighting -->

  <ellipse cx="170"
           cy="190"
           rx="250"
           ry="230"
           fill="url(#ambientBlue)"/>

  <ellipse cx="1020"
           cy="40"
           rx="300"
           ry="200"
           fill="url(#ambientBlue)"
           opacity="0.35"/>


  <!-- ===================================================== -->
  <!-- LEFT AI NETWORK -->
  <!-- ===================================================== -->

  <g transform="translate(30,42)">

    <!-- Large abstract orbital rings -->

    <ellipse cx="175"
             cy="145"
             rx="145"
             ry="92"
             fill="none"
             stroke="#38bdf8"
             stroke-width="1"
             stroke-opacity="0.18"
             transform="rotate(-20 175 145)"/>

    <ellipse cx="175"
             cy="145"
             rx="125"
             ry="70"
             fill="none"
             stroke="#818cf8"
             stroke-width="1"
             stroke-opacity="0.15"
             transform="rotate(28 175 145)"/>

    <ellipse cx="175"
             cy="145"
             rx="170"
             ry="105"
             fill="none"
             stroke="#38bdf8"
             stroke-width="0.8"
             stroke-opacity="0.10"
             transform="rotate(-8 175 145)"/>


    <!-- Network connections -->

    <g fill="none"
       stroke="url(#purple)"
       stroke-width="1"
       stroke-opacity="0.35">

      <path d="M65 105 L120 55 L190 75 L250 125 L210 190 L125 210 L65 160 Z"/>

      <path d="M120 55 L125 210"/>

      <path d="M65 105 L210 190"/>

      <path d="M190 75 L65 160"/>

      <path d="M250 125 L125 210"/>

    </g>


    <!-- Central connections -->

    <g stroke="#38bdf8"
       stroke-width="1"
       stroke-opacity="0.35">

      <line x1="157"
            y1="130"
            x2="120"
            y2="55"/>

      <line x1="157"
            y1="130"
            x2="190"
            y2="75"/>

      <line x1="157"
            y1="130"
            x2="250"
            y2="125"/>

      <line x1="157"
            y1="130"
            x2="210"
            y2="190"/>

      <line x1="157"
            y1="130"
            x2="125"
            y2="210"/>

      <line x1="157"
            y1="130"
            x2="65"
            y2="160"/>

      <line x1="157"
            y1="130"
            x2="65"
            y2="105"/>

    </g>


    <!-- Outer nodes -->

    <g filter="url(#smallGlow)">

      <!-- Node 1 -->

      <circle cx="120"
              cy="55"
              r="4"
              fill="#38bdf8"/>

      <circle cx="120"
              cy="55"
              r="9"
              fill="none"
              stroke="#38bdf8"
              stroke-opacity="0.3"/>


      <!-- Node 2 -->

      <circle cx="190"
              cy="75"
              r="4"
              fill="#818cf8"/>

      <circle cx="190"
              cy="75"
              r="9"
              fill="none"
              stroke="#818cf8"
              stroke-opacity="0.25"/>


      <!-- Node 3 -->

      <circle cx="250"
              cy="125"
              r="4"
              fill="#38bdf8"/>


      <!-- Node 4 -->

      <circle cx="210"
              cy="190"
              r="4"
              fill="#a78bfa"/>


      <!-- Node 5 -->

      <circle cx="125"
              cy="210"
              r="4"
              fill="#38bdf8"/>


      <!-- Node 6 -->

      <circle cx="65"
              cy="160"
              r="4"
              fill="#818cf8"/>


      <!-- Node 7 -->

      <circle cx="65"
              cy="105"
              r="4"
              fill="#38bdf8"/>

    </g>


    <!-- Central hexagon -->

    <g transform="translate(157,130)"
       filter="url(#glowBlue)">

      <polygon
        points="0,-34
                29,-17
                29,17
                0,34
                -29,17
                -29,-17"
        fill="#07111d"
        fill-opacity="0.9"
        stroke="url(#blue)"
        stroke-width="2"/>

      <!-- Brain / AI symbol -->

      <path d="M-9,-8
               C-17,-8 -17,3 -10,5
               C-16,10 -12,18 -5,16
               C-2,22 7,19 7,13
               C15,14 18,4 11,1
               C16,-7 8,-14 2,-10
               C-1,-17 -10,-14 -9,-8Z"

            fill="none"
            stroke="#e0f2fe"
            stroke-width="2"
            stroke-linecap="round"/>

      <path d="M0,-11
               L0,16
               M-8,0
               L0,0
               M0,6
               L8,6"

            fill="none"
            stroke="#38bdf8"
            stroke-width="1.5"
            stroke-linecap="round"/>

    </g>


    <!-- Decorative small particles -->

    <g fill="#ffffff">

      <circle cx="42" cy="70" r="1.5" opacity="0.6"/>
      <circle cx="285" cy="80" r="1.5" opacity="0.4"/>
      <circle cx="270" cy="215" r="1.5" opacity="0.5"/>
      <circle cx="95" cy="230" r="1" opacity="0.4"/>
      <circle cx="220" cy="40" r="1" opacity="0.5"/>

    </g>

  </g>


  <!-- ===================================================== -->
  <!-- SUBTLE DIVIDER -->
  <!-- ===================================================== -->

  <line x1="350"
        y1="42"
        x2="350"
        y2="315"
        stroke="#ffffff"
        stroke-opacity="0.07"
        stroke-width="1"/>


  <!-- ===================================================== -->
  <!-- MAIN CONTENT -->
  <!-- ===================================================== -->

  <g transform="translate(410,55)">


    <!-- NAME -->

    <text x="0"
          y="65"
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
          font-size="62"
          font-weight="700"
          letter-spacing="2"
          fill="#f8fafc">

      SATYAM

    </text>


    <!-- Small blue line -->

    <rect x="2"
          y="82"
          width="55"
          height="3"
          rx="1.5"
          fill="url(#blue)"/>


    <!-- ROLE -->

    <text x="0"
          y="112"
          font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
          font-size="17"
          font-weight="500"
          letter-spacing="4"
          fill="#bae6fd">

      AI SOFTWARE ENGINEER

    </text>


    <!-- ================================================= -->
    <!-- CAPABILITY CARDS -->
    <!-- ================================================= -->

    <g transform="translate(0,140)">


      <!-- AGENTIC AI -->

      <g>

        <rect x="0"
              y="0"
              width="145"
              height="58"
              rx="8"
              fill="#0b1420"
              fill-opacity="0.75"
              stroke="#38bdf8"
              stroke-opacity="0.25"/>

        <!-- icon -->

        <circle cx="27"
                cy="29"
                r="14"
                fill="#07111c"
                stroke="#38bdf8"
                stroke-opacity="0.55"/>

        <path d="M21 29
                 C18 25 21 20 25 21
                 C27 17 34 19 34 24
                 C38 26 36 32 33 33
                 C33 38 26 40 24 35
                 C20 36 18 32 21 29Z"

              fill="none"
              stroke="#7dd3fc"
              stroke-width="1.5"/>

        <text x="50"
              y="26"
              font-family="Inter, Arial, sans-serif"
              font-size="12"
              font-weight="600"
              letter-spacing="1"
              fill="#f8fafc">

          AGENTIC AI

        </text>

        <text x="50"
              y="42"
              font-family="Inter, Arial, sans-serif"
              font-size="9"
              letter-spacing="1.2"
              fill="#64748b">

          INTELLIGENT SYSTEMS

        </text>

      </g>


      <!-- FULL STACK -->

      <g transform="translate(158,0)">

        <rect x="0"
              y="0"
              width="145"
              height="58"
              rx="8"
              fill="#0b1420"
              fill-opacity="0.75"
              stroke="#818cf8"
              stroke-opacity="0.25"/>

        <circle cx="27"
                cy="29"
                r="14"
                fill="#0a0d18"
                stroke="#818cf8"
                stroke-opacity="0.55"/>

        <path d="M20 27 L25 22 L30 27
                 M30 31 L25 36 L20 31"

              fill="none"
              stroke="#a5b4fc"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <text x="50"
              y="26"
              font-family="Inter, Arial, sans-serif"
              font-size="12"
              font-weight="600"
              letter-spacing="1"
              fill="#f8fafc">

          FULL STACK

        </text>

        <text x="50"
              y="42"
              font-family="Inter, Arial, sans-serif"
              font-size="9"
              letter-spacing="1.2"
              fill="#64748b">

          WEB APPLICATIONS

        </text>

      </g>


      <!-- DATABASES -->

      <g transform="translate(316,0)">

        <rect x="0"
              y="0"
              width="145"
              height="58"
              rx="8"
              fill="#0b1420"
              fill-opacity="0.75"
              stroke="#22d3ee"
              stroke-opacity="0.25"/>

        <circle cx="27"
                cy="29"
                r="14"
                fill="#071417"
                stroke="#22d3ee"
                stroke-opacity="0.55"/>

        <ellipse cx="27"
                 cy="23"
                 rx="7"
                 ry="3"
                 fill="none"
                 stroke="#67e8f9"
                 stroke-width="1.5"/>

        <path d="M20 23 V34
                 C20 37 34 37 34 34
                 V23"

              fill="none"
              stroke="#67e8f9"
              stroke-width="1.5"/>

        <path d="M20 28
                 C20 31 34 31 34 28"

              fill="none"
              stroke="#67e8f9"
              stroke-width="1"/>

        <text x="50"
              y="26"
              font-family="Inter, Arial, sans-serif"
              font-size="12"
              font-weight="600"
              letter-spacing="1"
              fill="#f8fafc">

          DATABASES

        </text>

        <text x="50"
              y="42"
              font-family="Inter, Arial, sans-serif"
              font-size="9"
              letter-spacing="1.2"
              fill="#64748b">

          DATA SYSTEMS

        </text>

      </g>


      <!-- CLOUDS -->

      <g transform="translate(474,0)">

        <rect x="0"
              y="0"
              width="145"
              height="58"
              rx="8"
              fill="#0b1420"
              fill-opacity="0.75"
              stroke="#94a3b8"
              stroke-opacity="0.3"/>

        <circle cx="27"
                cy="29"
                r="14"
                fill="#0c1016"
                stroke="#cbd5e1"
                stroke-opacity="0.45"/>

        <path d="M19 31
                 C18 27 21 24 25 25
                 C27 20 34 21 35 26
                 C39 26 40 32 36 34
                 H21
                 C18 34 17 32 19 31Z"

              fill="none"
              stroke="#e2e8f0"
              stroke-width="1.5"/>

        <text x="50"
              y="26"
              font-family="Inter, Arial, sans-serif"
              font-size="12"
              font-weight="600"
              letter-spacing="1"
              fill="#f8fafc">

          CLOUDS

        </text>

        <text x="50"
              y="42"
              font-family="Inter, Arial, sans-serif"
              font-size="9"
              letter-spacing="1.2"
              fill="#64748b">

          SCALABLE SYSTEMS

        </text>

      </g>

    </g>


    <!-- ================================================= -->
    <!-- CONTACT SECTION -->
    <!-- ================================================= -->

    <line x1="0"
          y1="225"
          x2="620"
          y2="225"
          stroke="#ffffff"
          stroke-opacity="0.08"/>


    <!-- GitHub -->

    <g transform="translate(0,250)">

      <!-- GitHub icon -->

      <circle cx="10"
              cy="0"
              r="10"
              fill="#f8fafc"/>

      <path d="M6 -4
               C4 -3 4 -1 5 0
               C4 1 4 3 6 4
               C6 6 8 7 10 7
               C12 7 14 6 14 4
               C16 3 16 1 15 0
               C16 -1 16 -3 14 -4
               C13 -5 11 -5 10 -4
               C9 -5 7 -5 6 -4Z"

            fill="#05080d"/>

      <text x="28"
            y="4"
            font-family="Inter, Arial, sans-serif"
            font-size="11"
            font-weight="500"
            letter-spacing="0.3"
            fill="#cbd5e1">

        github.com/Satyam2006chh

      </text>

    </g>


    <!-- Email -->

    <g transform="translate(330,250)">

      <rect x="0"
            y="-7"
            width="20"
            height="14"
            rx="2"
            fill="none"
            stroke="#cbd5e1"
            stroke-width="1.5"/>

      <path d="M1 -6 L10 1 L19 -6"
            fill="none"
            stroke="#cbd5e1"
            stroke-width="1.5"/>

      <text x="30"
            y="4"
            font-family="Inter, Arial, sans-serif"
            font-size="11"
            font-weight="500"
            letter-spacing="0.3"
            fill="#cbd5e1">

        satyam.ai06plac@gmail.com

      </text>

    </g>

  </g>


  <!-- ===================================================== -->
  <!-- TOP RIGHT MICRO TAGLINE -->
  <!-- ===================================================== -->

  <g transform="translate(1065,42)">

    <text x="0"
          y="0"
          font-family="Inter, Arial, sans-serif"
          font-size="8"
          font-weight="500"
          letter-spacing="2"
          fill="#64748b">

      BUILD

    </text>

    <text x="0"
          y="16"
          font-family="Inter, Arial, sans-serif"
          font-size="8"
          font-weight="500"
          letter-spacing="2"
          fill="#64748b">

      INTELLIGENT

    </text>

    <text x="0"
          y="32"
          font-family="Inter, Arial, sans-serif"
          font-size="8"
          font-weight="500"
          letter-spacing="2"
          fill="#64748b">

      SOLUTIONS

    </text>

    <rect x="0"
          y="46"
          width="24"
          height="2"
          fill="url(#blue)"/>

  </g>

</svg>
